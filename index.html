<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Worm GPT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg-main: #0d0f12;
      --bg-sidebar: #131927;
      --bg-header: #0f131a;
      --bg-item: #182033;
      --bg-item-hover: #1d2942;
      --border-color: #1e2d42;
      --text-main: #e3e3e3;
      --text-secondary: #88a0c0;
      --accent-color: #ff3333;
      --accent-hover: #cc0000;
      --accent-shadow: rgba(255, 51, 51, 0.3);
      --user-msg-bg: #ff3333;
      --user-msg-color: #ffffff;
      --ai-msg-bg: #131927;
      --error-bg: #2b1318;
      --error-border: #5c1d24;
      --error-text: #ff9999;
    }

    .light-theme {
      --bg-main: #f4f5f7;
      --bg-sidebar: #ffffff;
      --bg-header: #eaeef3;
      --bg-item: #e5ebf2;
      --bg-item-hover: #d5dff0;
      --border-color: #cbd5e1;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --accent-color: #dc2626;
      --accent-hover: #b91c1c;
      --accent-shadow: rgba(220, 38, 38, 0.2);
      --user-msg-bg: #dc2626;
      --user-msg-color: #ffffff;
      --ai-msg-bg: #ffffff;
      --error-bg: #ffeeef;
      --error-border: #fca5a5;
      --error-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border-left: 1px solid var(--border-color);
      z-index: 50;
      transition: transform 0.3s ease, background-color 0.3s, border-color 0.3s;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .close-sidebar-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-item-hover);
    }

    .new-chat-btn {
      flex: 1;
      padding: 10px;
      background-color: var(--accent-color);
      border: 1px solid var(--accent-hover);
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      box-shadow: 0 2px 8px var(--accent-shadow);
    }

    .new-chat-btn:hover {
      background-color: var(--accent-hover);
    }

    .history-list {
      flex: 1;
      margin-top: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px 12px;
      background-color: var(--bg-item);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: 0.2s;
    }

    .history-item.active {
      background-color: var(--accent-color);
      border-color: var(--accent-hover);
      color: #fff;
    }

    .history-item:hover {
      background-color: var(--bg-item-hover);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .delete-btn:hover {
      color: #ff5555;
      background-color: rgba(255, 85, 85, 0.15);
    }

    .sidebar-footer {
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .footer-action-btn {
      flex: 1;
      background: var(--bg-item);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: 10px;
      transition: 0.2s;
      text-align: center;
    }

    .footer-action-btn:hover {
      background-color: var(--bg-item-hover);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      position: relative;
      height: 100%;
    }

    .chat-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-header);
    }

    .menu-toggle-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 6px;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .menu-toggle-btn:hover {
      background-color: var(--bg-item);
    }

    .chat-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-shadow);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .user-msg-wrapper {
      align-self: flex-start;
    }

    .ai-msg-wrapper {
      align-self: flex-end;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user-msg {
      background-color: var(--user-msg-bg);
      color: var(--user-msg-color);
      box-shadow: 0 2px 8px var(--accent-shadow);
    }

    .ai-msg {
      background-color: var(--ai-msg-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .ai-msg.error {
      background-color: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    /* زر نسخ الرسالة تحت كل رسالة */
    .msg-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .copy-msg-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: 0.2s;
    }

    .copy-msg-btn:hover {
      color: var(--accent-color);
      background-color: var(--bg-item);
    }

    .code-block-wrapper {
      position: relative;
      background: #090a0d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin: 10px 0;
      overflow: hidden;
      direction: ltr;
      text-align: left;
    }

    .code-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121620;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: bold;
    }

    .code-actions {
      display: flex;
      gap: 6px;
    }

    .code-action-btn {
      background: #1a2233;
      border: 1px solid var(--border-color);
      color: #e3e3e3;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .code-action-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-hover);
      color: #fff;
    }

    .code-block-wrapper pre {
      padding: 12px;
      overflow-x: auto;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      color: #f8f8f2;
    }

    .chat-input-wrapper {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-main);
      border-top: 1px solid var(--border-color);
    }

    .chat-input-container {
      flex: 1;
      background-color: var(--bg-sidebar);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 2px 14px;
      border: 1px solid var(--border-color);
    }

    .chat-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      padding: 8px 0;
      font-size: 14px;
    }

    .chat-input::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .send-btn:hover {
      color: var(--accent-hover);
      transform: scale(1.05);
    }

    .sidebar-overlay {
      display: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--bg-sidebar);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      font-size: 16px;
      color: var(--text-main);
    }

    .modal-content input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-save {
      background: var(--accent-color);
      color: white;
    }

    .btn-save:hover {
      background: var(--accent-hover);
    }

    .btn-cancel {
      background: var(--bg-item);
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .menu-toggle-btn {
        display: flex;
      }

      .close-sidebar-btn {
        display: block;
      }

      .sidebar-overlay {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.75);
        z-index: 40;
      }

      .sidebar-overlay.show {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        transform: translateX(100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .chat-messages {
        padding: 12px;
      }

      .msg-wrapper {
        max-width: 90%;
      }
    }
  </style>
</head>
<body id="appBody">

      </div>
    </div>
  </div>

  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h3 id="keyModalTitle">إعداد كلمة السر</h3>
      <input type="password" id="apiKeyInput" placeholder="أدخل كلمة السر هنا...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeKeyModal()" id="cancelKeyText">إلغاء</button>
        <button class="btn-save" onclick="saveApiKey()" id="saveKeyText">حفظ</button>
      </div>
    </div>
  </div>

    let chats = JSON.parse(localStorage.getItem('app_chats')) || [];
    let currentChatId = localStorage.getItem('app_current_chat') || null;

    window.onload = () => {
      applyThemeAndLang();
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (!currentChatId || !chats.some(c => c.id === currentChatId)) {
          currentChatId = chats[0].id;
        }
        renderHistory();
        renderMessages();
      }
    };

    function applyThemeAndLang() {
      const body = document.getElementById('appBody');
      if (currentTheme === 'light') {
        body.classList.add('light-theme');
        document.getElementById('themeIcon').innerText = '🌙';
        document.getElementById('themeBtnText').innerText = currentLang === 'en' ? 'Night' : 'مسائي';
      } else {
        body.classList.remove('light-theme');
        document.getElementById('themeIcon').innerText = '☀️';
        document.getElementById('themeBtnText').innerText = currentLang === 'en' ? 'Day' : 'صباحي';
      }

      if (currentLang === 'en') {
        document.documentElement.setAttribute('lang', 'en');
        document.documentElement.setAttribute('dir', 'ltr');
        document.getElementById('newChatText').innerText = 'New Chat';
        document.getElementById('apiKeyBtnText').innerText = 'Password';
        document.getElementById('langBtnText').innerText = 'AR';
        document.getElementById('userInput').placeholder = 'Type your question here...';
        document.getElementById('keyModalTitle').innerText = 'Password Setup';
        document.getElementById('apiKeyInput').placeholder = 'Enter password here...';
        document.getElementById('cancelKeyText').innerText = 'Cancel';
        document.getElementById('saveKeyText').innerText = 'Save';
      } else {
        document.documentElement.setAttribute('lang', 'ar');
        document.documentElement.setAttribute('dir', 'rtl');
        document.getElementById('newChatText').innerText = 'محادثة جديدة';
        document.getElementById('apiKeyBtnText').innerText = 'كلمة السر';
        document.getElementById('langBtnText').innerText = 'EN';
        document.getElementById('userInput').placeholder = 'اكتب سؤالك هنا...';
        document.getElementById('keyModalTitle').innerText = 'إعداد كلمة السر';
        document.getElementById('apiKeyInput').placeholder = 'أدخل كلمة السر هنا...';
        document.getElementById('cancelKeyText').innerText = 'إلغاء';
        document.getElementById('saveKeyText').innerText = 'حفظ';
      }
    }

    // تبديل سريع ومباشر للغة دون قوائم منبثقة
    function toggleLanguageQuick() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('app_lang', currentLang);
      applyThemeAndLang();
      renderHistory();
      renderMessages();
      closeSidebar();
    }

    function toggleThemeQuick() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('app_theme', currentTheme);
      applyThemeAndLang();
      closeSidebar();
    }

    function toggleSidebar() {
      if (window.innerWidth <= 768) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      }
    }

    function closeSidebar() {
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
      }
    }

    function openKeyModal() {
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('keyModal').style.display = 'flex';
      closeSidebar();
    }

    function closeKeyModal() {
      document.getElementById('keyModal').style.display = 'none';
    }

    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('app_api_key', apiKey);
      closeKeyModal();
    }

    function createNewChat() {
      currentChatId = Date.now().toString();
      chats.unshift({
        id: currentChatId,
        title: currentLang === 'en' ? 'New Chat' : 'محادثة جديدة',
        messages: []
      });
      saveChatsToStorage();
      renderHistory();
      renderMessages();
      closeSidebar();
    }

    function loadChat(chatId) {
      currentChatId = chatId;
      localStorage.setItem('app_current_chat', currentChatId);
      renderHistory();
      renderMessages();
      closeSidebar();
    }

    function deleteChat(chatId, event) {
      event.stopPropagation();
      chats = chats.filter(c => c.id !== chatId);
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (currentChatId === chatId) {
          currentChatId = chats[0].id;
        }
        saveChatsToStorage();
        renderHistory();
        renderMessages();
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
        item.onclick = () => loadChat(chat.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = currentLang === 'en' ? 'Delete Chat' : 'حذف المحادثة';
        deleteBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        `;
        deleteBtn.onclick = (e) => deleteChat(chat.id, e);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'history-title';
        titleSpan.innerText = chat.title;

        item.appendChild(deleteBtn);
        item.appendChild(titleSpan);
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';
      const activeChat = chats.find(c => c.id === currentChatId);
      if (activeChat) {
        activeChat.messages.forEach(m => {
          appendMessageUI(m.text, m.type);
        });
      }
    }

    // دالة تحليل النص لعرض الأكواد مع أزرار التحميل والنسخ
    function formatMessageContent(text, msgElement) {
      msgElement.innerHTML = '';
      
      const codeBlockRegex = /```([a-zA-Z]*)\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      while ((match = codeBlockRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          const textPart = document.createTextNode(text.substring(lastIndex, match.index));
          msgElement.appendChild(textPart);
        }

        const lang = match[1] || 'CODE';
        const codeContent = match[2];

        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';

        const headerBar = document.createElement('div');
        headerBar.className = 'code-header-bar';
        
        const langSpan = document.createElement('span');
        langSpan.innerText = lang.toUpperCase();
        headerBar.appendChild(langSpan);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'code-actions';

        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'code-action-btn';
        downloadBtn.title = currentLang === 'en' ? 'Download Code' : 'تحميل الكود';
        downloadBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
        downloadBtn.onclick = () => {
          let extension = 'txt';
          if (lang.toLowerCase() === 'html') extension = 'html';
          else if (lang.toLowerCase() === 'css') extension = 'css';
          else if (lang.toLowerCase() === 'js' || lang.toLowerCase() === 'javascript') extension = 'js';
          else if (lang.toLowerCase() === 'python' || lang.toLowerCase() === 'py') extension = 'py';
          
          const blob = new Blob([codeContent], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `code_snippet.${extension}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };

        const copyBtn = document.createElement('button');
        copyBtn.className = 'code-action-btn';
        copyBtn.title = currentLang === 'en' ? 'Copy Code' : 'نسخ الكود';
        copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(codeContent).then(() => {
            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            setTimeout(() => {
              copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
            }, 1500);
          });
        };

        actionsDiv.appendChild(downloadBtn);
        actionsDiv.appendChild(copyBtn);
        headerBar.appendChild(actionsDiv);
        wrapper.appendChild(headerBar);

        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.textContent = codeContent;
        pre.appendChild(codeEl);
        wrapper.appendChild(pre);

        msgElement.appendChild(wrapper);
        lastIndex = match.index + match[0].length;
      }

      if (lastIndex < text.length) {
        const remainingText = document.createTextNode(text.substring(lastIndex));
        msgElement.appendChild(remainingText);
      }
    }

    // إضافة واجهة الرسالة مع زر النسخ تحت كل رسالة
    function appendMessageUI(text, type) {
      const box = document.getElementById('chatMessages');
      
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper ' + (type === 'user-msg' ? 'user-msg-wrapper' : 'ai-msg-wrapper');

      const msg = document.createElement('div');
      msg.className = 'msg ' + type;
      
      if (type === 'ai-msg') {
        formatMessageContent(text, msg);
      } else {
        msg.textContent = text;
      }

      wrapper.appendChild(msg);

      // زر نسخ الرسالة تحت كل رسالة
      const footer = document.createElement('div');
      footer.className = 'msg-footer';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-msg-btn';
      copyBtn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>${currentLang === 'en' ? 'Copy' : 'نسخ'}</span>
      `;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = `<span style="color: #22c55e;">${currentLang === 'en' ? 'Copied!' : 'تم النسخ!'}</span>`;
          setTimeout(() => {
            copyBtn.innerHTML = `
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>${currentLang === 'en' ? 'Copy' : 'نسخ'}</span>
            `;
          }, 1500);
        });
      };

      footer.appendChild(copyBtn);
      wrapper.appendChild(footer);

      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return { msgElement: msg, wrapperElement: wrapper };
    }

    function saveChatsToStorage() {
      localStorage.setItem('app_chats', JSON.stringify(chats));
      if (currentChatId) {
        localStorage.setItem('app_current_chat', currentChatId);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const prompt = input.value.trim();

      if (!prompt) return;
      if (!apiKey) {
        alert(currentLang === 'en' ? 'Please enter and save your password first!' : 'يجب إدخال وحفظ كلمة السر أولاً!');
        openKeyModal();
        return;
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      if (!activeChat) return;

      if (activeChat.messages.length === 0) {
        activeChat.title = prompt.length > 20 ? prompt.substring(0, 20) + '...' : prompt;
        renderHistory();
      }

      activeChat.messages.push({ text: prompt, type: 'user-msg' });
      appendMessageUI(prompt, 'user-msg');
      input.value = '';

      const loadingObj = appendMessageUI(currentLang === 'en' ? 'Thinking...' : 'جاري التفكير...', 'ai-msg');
      const loadingMsg = loadingObj.msgElement;

      try {
        let apiContents = [];

        activeChat.messages.forEach(m => {
          apiContents.push({
            role: m.type === 'user-msg' ? 'user' : 'model',
            parts: [{ text: m.text }]
          });
        });

        let requestBody = {
          contents: apiContents
        };

        if (hiddenSystemPrompt) {
          requestBody.system_instruction = {
            parts: [{ text: hiddenSystemPrompt }]
          };
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          const replyText = data.candidates[0].content.parts[0].text;
          loadingMsg.textContent = '';
          formatMessageContent(replyText, loadingMsg);
          activeChat.messages.push({ text: replyText, type: 'ai-msg' });
        } else {
          const errDetail = data.error ? data.error.message : (currentLang === 'en' ? 'Check your key.' : 'تأكد من صحة كلمة السر.');
          loadingMsg.textContent = (currentLang === 'en' ? 'Error: ' : 'حدث خطأ: ') + errDetail;
          loadingMsg.classList.add('error');
        }
      } catch (err) {
        loadingMsg.textContent = currentLang === 'en' ? 'Network error occurred.' : 'حدث خطأ أثناء الاتصال بالشبكة.';
        loadingMsg.classList.add('error');
      }

      saveChatsToStorage();
    }
  </script>
